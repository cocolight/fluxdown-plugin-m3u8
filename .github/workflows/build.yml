name: build

# 门禁：结构断言（check-fast）+ 类型检查 + 构建 + manifest 校验 + 四层测试。
# required status checks 请勾选下面 test job（job id 为 test，未设 name）。

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# runner 镜像显式钉版本，不跟随 ubuntu-latest：隐式跟随会在 GitHub 切换镜像时
# 让 CI 行为突变（例如系统依赖的包名变化）。升级镜像前请先在分支上验证依赖。
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 结构类断言只有一份，在 scripts/check-fast.sh：本地 pre-commit 与这里跑同一个脚本。
      # 覆盖 AGENTS.md 行数（≤200）、CHANGELOG 条目体积（≤150 字符）、
      # .agents/ 文档是否都进了 AGENTS.md §1 路由表、skill frontmatter、两处版本号一致、
      # 代码文件的行尾空白与冲突标记。
      # 不要把断言抄一份到这里 —— 两份必然漂移。
      - name: 快速门禁
        run: ./scripts/check-fast.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # manifest 与产物的规范校验。风险等级报 elevated 属预期（由 auth 与 ffmpeg 权限决定）。
      - name: 校验 manifest 与产物
        run: npm run validate

      # 四层测试：
      #   parity      —— 与 v1.8.0 冻结基线逐场景比对，声明 diverges 的算已知差异，差异消失会报错
      #   contract    —— 请求面契约（凭据作用域、Basic 编码、Range 换算）
      #   intercept   —— 拦截器契约（成对性、密钥边界、不丢空、归属判定）
      #   postprocess —— 后处理契约（产物登记、容器探测、探测失败回退）
      - name: 测试
        run: npm test

  # 门禁：feat/fix 改了代码却没更新 CHANGELOG，就拦下（防「CHANGELOG 欠账」）。
  # 只在 pull_request 时跑——push 到 master 时代码已合并，再检查无意义。
  # 三级响应：
  #   - PR 描述含 `[skip changelog]` → 跳过（豁免口，用于纯测试/CI/无行为变化的重构）
  #   - feat/fix 的代码改动、未更新 CHANGELOG → 失败（硬拦）
  #   - 非 feat/fix 的代码改动、未更新 CHANGELOG → 仅 warning（不阻断）
  # 要让它真正阻断合并，请在分支保护里把这个 job 一并设为 required status check。
  changelog:
    name: Changelog gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要 base..head 的完整历史才能 diff

      - name: 检查 feat/fix 是否更新了 CHANGELOG
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.body, '[skip changelog]') }}
        run: |
          set -eu
          # 1) 豁免口：PR 描述显式声明 [skip changelog]
          if [ "$SKIP_CHANGELOG" = "true" ]; then
            echo "PR 含 [skip changelog]，跳过检查"
            exit 0
          fi
          # 2) 本次 PR 改动的文件
          # diff 基准必须取 merge-base，不能直接用 pull_request.base.sha ——
          # 后者会随主分支前进而变化，于是主分支在分叉点之后改过的文件（含
          # CHANGELOG.md）会被算进「本次 PR 的改动」，门禁在 PR 根本没补记录时假绿。
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          # 3) 是否改了「代码」：排除纯文档（.md）与仓库级配置文件
          CODE_CHANGED="$(printf '%s\n' "$CHANGED" \
            | grep -vE '\.md$' \
            | grep -vE '^(LICENSE|\.gitignore|\.gitattributes|\.editorconfig)$' \
            | grep -v '^docs/' \
            | head -n 1)"
          if [ -z "$CODE_CHANGED" ]; then
            echo "纯文档改动，无需 CHANGELOG"
            exit 0
          fi
          # 4) commit 是否含 feat/fix（用户可见变更）
          HAS_FEATFIX="$(git log "$MERGE_BASE".."$HEAD_SHA" --pretty=format:%s | grep -E '^(feat|fix)' || true)"
          # 5) CHANGELOG 是否已更新
          if printf '%s\n' "$CHANGED" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md 已更新"
            exit 0
          fi
          # 6) feat/fix 硬拦，其余仅提醒
          if [ -n "$HAS_FEATFIX" ]; then
            echo "::error::本 PR 含 feat/fix 的代码改动，须在 CHANGELOG.md 的 [Unreleased] 记录（或 PR 描述加 [skip changelog]）"
            exit 1
          fi
          echo "::warning::本 PR 改了代码但未更新 CHANGELOG（非 feat/fix，仅提醒）"

  # 发版守卫：tag 是不可逆的动作，把「前置条件」从文档里的自觉改成可回滚的失败。
  # 只在推送 v* tag 时运行，与 AGENTS.md §3「发版」的前置清单对齐。
  release-guard:
    name: Release guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: tag 与 CHANGELOG / ROADMAP 一致性
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          printf 'tag=%s version=%s\n' "$TAG" "$VER"
          if ! grep -qE "^## \[$VER\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            printf '::error::CHANGELOG.md 缺少填实日期的版本节：期望 "## [%s] - YYYY-MM-DD"（tag 为 %s；「未发布」占位不算填实）\n' "$VER" "$TAG"
            exit 1
          fi
          if grep -qE '\|[[:space:]]*in-progress[[:space:]]*\|' ROADMAP.md; then
            printf '::error::ROADMAP.md 仍有 in-progress 行，发版前置未满足\n'
            exit 1
          fi
          printf 'release guard 通过\n'
