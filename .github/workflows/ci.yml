name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 校验 manifest 与产物
        run: npm run validate

      # 行为回归：dist/ 与 tests/legacy/（v1.8.0 基线）逐场景比对。
      # 声明了 diverges 的场景算「已知差异」，但差异消失会报错（豁免不许过期滞留）。
      - name: 行为回归比对
        run: npm run parity

      # 请求面契约：M2 起凭据只经 originHeaders 下发、Basic 的 UTF-8 编码正确、凭据不落库；
      # M4 起 maxRangeBytes 只在合法区间下发。
      - name: 请求面契约
        run: npm run contract

      # 拦截器契约：M3 起 segments 阶段去广告 —— 成对丢弃、不跨密钥边界、不丢空、只碰本插件任务。
      - name: 拦截器契约
        run: npm run intercept

      # 后处理契约：M4 起登记 remux 产物、用 ffprobe 判容器、探测失败必须退回扩展名判断。
      - name: 后处理契约
        run: npm run postprocess
